<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Participant Confirmation - Watermark Participant Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="confirmation-page">
  <div class="confirmation-wrapper">
    <div class="confirmation-card">
      <h1>Participant Confirmation</h1>
      <p class="subtitle">Mohon lengkapi konfirmasi kehadiran dan kebutuhan dasar Anda.</p>

      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox">
        Terima kasih. Data konfirmasi Anda sudah berhasil dikirim.
      </div>

      <div class="guest-box" id="guestBox">Loading participant data...</div>

      <form id="confirmationForm" style="display:none;">
        <label>Attendance Confirmation</label>
        <select id="attendance" required>
          <option value="Attend">Attend</option>
          <option value="Not Attend">Not Attend</option>
        </select>

        <label>Need Hotel?</label>
        <select id="hotelNeeded" required>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <label>Need Transport?</label>
        <select id="transportNeeded" required>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <label>Food Restriction</label>
        <textarea id="foodRestriction" placeholder="Contoh: No seafood, vegetarian, halal only, allergy kacang, dll."></textarea>

        <label>Additional Notes</label>
        <textarea id="notes" placeholder="Catatan tambahan untuk panitia."></textarea>

        <button type="submit">Submit Confirmation</button>
      </form>

      <br />
      <a href="index.html" class="btn-link">Back to Dashboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const participantId = params.get("id");

    let participant = null;
    let eventData = null;
    let existingConfirmation = null;

    const guestBox = document.getElementById("guestBox");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const confirmationForm = document.getElementById("confirmationForm");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      guestBox.style.display = "none";
      confirmationForm.style.display = "none";
    }

    async function fetchParticipant() {
      if (!participantId) {
        showError("Link peserta tidak valid. Mohon hubungi panitia.");
        return;
      }

      const { data, error } = await supabaseClient
        .from("participants")
        .select("*")
        .eq("id", participantId)
        .single();

      if (error || !data) {
        console.error(error);
        showError("Data peserta tidak ditemukan. Mohon hubungi panitia.");
        return;
      }

      participant = data;

      await fetchEvent();
      await fetchExistingConfirmation();

      renderParticipant();
    }

    async function fetchEvent() {
      if (!participant.event_id) return;

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .eq("id", participant.event_id)
        .single();

      if (!error && data) {
        eventData = data;
      }
    }

    async function fetchExistingConfirmation() {
      const { data, error } = await supabaseClient
        .from("confirmations")
        .select("*")
        .eq("participant_id", participantId)
        .maybeSingle();

      if (!error && data) {
        existingConfirmation = data;
      }
    }

    function renderParticipant() {
      guestBox.innerHTML = `
        <p><strong>Name:</strong> ${participant.full_name}</p>
        <p><strong>Company:</strong> ${participant.company || "-"}</p>
        <p><strong>Event:</strong> ${eventData?.event_name || "-"}</p>
        <p><strong>WhatsApp:</strong> ${participant.whatsapp || "-"}</p>
        <p><strong>Email:</strong> ${participant.email || "-"}</p>
      `;

      if (existingConfirmation) {
        document.getElementById("attendance").value = existingConfirmation.attendance || "Attend";
        document.getElementById("hotelNeeded").value = existingConfirmation.hotel_needed || "Yes";
        document.getElementById("transportNeeded").value = existingConfirmation.transport_needed || "Yes";
        document.getElementById("foodRestriction").value = existingConfirmation.food_restriction || "";
        document.getElementById("notes").value = existingConfirmation.notes || "";
      }

      confirmationForm.style.display = "flex";
    }

    async function saveConfirmation(payload) {
      const existingCheck = await supabaseClient
        .from("confirmations")
        .select("id")
        .eq("participant_id", participantId)
        .maybeSingle();

      if (existingCheck.data) {
        const { error } = await supabaseClient
          .from("confirmations")
          .update(payload)
          .eq("participant_id", participantId);

        if (error) throw error;
      } else {
        const { error } = await supabaseClient
          .from("confirmations")
          .insert([payload]);

        if (error) throw error;
      }
    }

    async function updateParticipantStatus(attendance) {
      const newStatus = attendance === "Attend" ? "Submitted" : "Not Attend";

      const { error } = await supabaseClient
        .from("participants")
        .update({ status: newStatus })
        .eq("id", participantId);

      if (error) throw error;
    }

    confirmationForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      try {
        const attendance = document.getElementById("attendance").value;

        const payload = {
          participant_id: participantId,
          attendance: attendance,
          hotel_needed: document.getElementById("hotelNeeded").value,
          transport_needed: document.getElementById("transportNeeded").value,
          food_restriction: document.getElementById("foodRestriction").value,
          notes: document.getElementById("notes").value
        };

        await saveConfirmation(payload);
        await updateParticipantStatus(attendance);

        successBox.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        console.error(error);
        alert("Failed to submit confirmation.");
      }
    });

    fetchParticipant();
  </script>
</body>
</html>
