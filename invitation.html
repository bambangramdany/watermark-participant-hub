<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Invitation - Watermark Participant Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="confirmation-page">
  <div class="confirmation-wrapper">
    <div class="invitation-card">
      <div id="invitationContent">Loading invitation...</div>

      <div class="qr-placeholder" id="qrBox">
        Loading QR...
      </div>

      <div class="event-pass-footer">
        Please show this QR code at the registration desk.
        <br />
        Watermark Participant Hub
      </div>

      <br />

      <a href="index.html" class="btn-link">
        Back to Dashboard
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const participantId = params.get("id");

    const invitationContent = document.getElementById("invitationContent");
    const qrBox = document.getElementById("qrBox");

    let participant = null;
    let eventData = null;

    function getBaseUrl() {
      return window.location.origin + window.location.pathname.replace("invitation.html", "");
    }

    function getCheckinUrl(id) {
      return `${getBaseUrl()}checkin.html?id=${id}`;
    }

    function showError(message) {
      invitationContent.innerHTML = `<h2>${message}</h2>`;
      qrBox.style.display = "none";
    }

    async function fetchParticipant() {
      if (!participantId) {
        showError("Invalid invitation link");
        return;
      }

      const { data, error } = await supabaseClient
        .from("participants")
        .select("*")
        .eq("id", participantId)
        .single();

      if (error || !data) {
        console.error(error);
        showError("Participant Not Found");
        return;
      }

      participant = data;

      await fetchEvent();
      renderInvitation();
    }

    async function fetchEvent() {
      if (!participant.event_id) return;

      const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .eq("id", participant.event_id)
        .single();

      if (!error && data) {
        eventData = data;
      }
    }

    function renderInvitation() {
      const checkinUrl = getCheckinUrl(participant.id);
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(checkinUrl)}`;

      invitationContent.innerHTML = `
        <h1>FINAL INVITATION</h1>

        <div class="invitation-badge">
          ${participant.status || "Pending"}
        </div>

        <h2>${participant.full_name}</h2>
        <p>${participant.company || "-"}</p>

        <br />

        <p>${eventData?.event_name || "No Event"}</p>
        <p>${eventData?.event_date || "-"}</p>
        <p>${eventData?.venue || "-"}</p>

        <br />

        <h3>${participant.table_number || "General Seating"}</h3>
        <p>${participant.meal_notes || ""}</p>
      `;

      qrBox.innerHTML = `
        <img
          src="${qrUrl}"
          alt="QR Code Event Pass"
          style="width: 180px; height: 180px; border-radius: 12px;"
        />
      `;
    }

    fetchParticipant();
  </script>
</body>
</html>
